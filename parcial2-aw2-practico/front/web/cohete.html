<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./recursos/css/estilos.css">
    <script type="module" src="./recursos/js/cohete.js"></script>
    <title>Rocket.com - Detalle</title>
</head>
<body class="cuerpo-aplicacion">

    <header class="cabecera-aplicacion">
        <a class="cabecera-aplicacion__enlace-logo" href="./index.html">
            <span class="cabecera-aplicacion__texto-logo">Rocket.com</span>
        </a>

        <nav class="cabecera-aplicacion__navegacion">
            <ul class="cabecera-aplicacion__lista">
                <li class="cabecera-aplicacion__item"><a class="cabecera-aplicacion__enlace" href="./index.html">Inicio</a></li>
                <li class="cabecera-aplicacion__item"><a class="cabecera-aplicacion__enlace" href="./carga-util.html">Ranking</a></li>
                <li class="cabecera-aplicacion__item"><a class="cabecera-aplicacion__enlace cabecera-aplicacion__enlace--cerrar-sesion" href="/cerrar-sesion">Cerrar sesión</a></li>
            </ul>
        </nav>
    </header>

    <main class="principal-aplicacion"> 
        <div class="contenedor">
            <h1 id="titulo-cohete" class="principal-aplicacion__titulo">-</h1>
            <section id="contenedor-datos-cohete" class="tarjeta-detalle">
               <ul class="tarjeta-detalle__lista">
                    <li class="tarjeta-detalle__item"><strong class="tarjeta-detalle__etiqueta">Operador:</strong> <span id="dato-operador" class="tarjeta-detalle__valor">-</span></li>
                    <li class="tarjeta-detalle__item"><strong class="tarjeta-detalle__etiqueta">Altura:</strong> <span id="dato-metros" class="tarjeta-detalle__valor">-</span> metros</li>
                    <li class="tarjeta-detalle__item"><strong class="tarjeta-detalle__etiqueta">Etapas:</strong> <span id="dato-etapas" class="tarjeta-detalle__valor">-</span></li>
                    <li class="tarjeta-detalle__item"><strong class="tarjeta-detalle__etiqueta">Carga útil:</strong> <span id="dato-toneladas" class="tarjeta-detalle__valor">-</span> toneladas</li>
                    <li class="tarjeta-detalle__item"><strong class="tarjeta-detalle__etiqueta">Reutilización:</strong> <span id="dato-reutilizacion" class="tarjeta-detalle__valor">-</span></li>
                </ul>
            </section>
        </div>
    </main>

    <footer class="pie-aplicacion">
        <p class="pie-aplicacion__texto">© 2026 Rocket.com</p>
    </footer>
</body>
</html>
